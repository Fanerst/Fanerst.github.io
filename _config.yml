# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Feng Pan"
title: "Assistant Professor"
institution: "Science, Mathematics and Technology Cluster, SUTD"
email: feng_pan@sutd.edu.sg
photo: feng-pan.jpg  # place your photo in images/

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: "https://scholar.google.com/citations?user=ZDEkIDsAAAAJ&hl"
  github: "https://github.com/Fanerst"
  researchgate: ""
  orcid: "https://orcid.org/0000-0003-1850-6520"
  twitter: ""
  linkedin: ""
  cv: "papers/cv.pdf"  # e.g., "papers/cv.pdf" — leave blank to hide the CV icon

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#1f6f64"      # theme color for links and buttons
dark_mode: true              # show dark mode toggle in navbar
description: "Feng Pan Research Group at SUTD: tensor networks, quantum computing, and statistical physics."
baseurl: ""
url: "https://fanerst.github.io"

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: about
  - name: publications
  - name: research
  - name: positions
  - name: team
  - name: talks
  - name: teaching

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Pan
  first_name: [Feng, F.]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - UPGRADING.md
  - setup.sh
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
