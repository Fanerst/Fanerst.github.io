---
layout: default
---

<div class="home-grid">
  <div class="home-content">
    {{ content }}
  </div>

  <div>
    {% include sidebar.html %}
  </div>
</div>

{% if site.data.news.size > 0 %}
<section class="home-news-section" aria-labelledby="home-news-heading">
  <div class="home-section-heading">
    <h3 id="home-news-heading">News</h3>
    <a href="{{ '/news/' | relative_url }}">All news</a>
  </div>
  <div class="home-news-list">
    {% for article in site.data.news limit:20 %}
    <article class="home-news-item">
      <time class="home-news-date">{{ article.date }}</time>
      <div class="home-news-headline">
        {% if article.url %}
        <a href="{{ article.url }}" target="_blank" rel="noopener noreferrer">{{ article.headline }}</a>
        {% else %}
        {{ article.headline }}
        {% endif %}
      </div>
    </article>
    {% endfor %}
  </div>
</section>
{% endif %}
